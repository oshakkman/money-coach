# Runs on every push: type check, unit tests, secret check and build.
# Free for private repositories within GitHub's included minutes.
name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
